name: UrbanSaarthi application checks

on:
  push:
    branches: [main]
    paths:
      - README.md
      - nagarseva/**
      - prototype/**
      - research/**
      - submission/**
      - scripts/**
      - tests/**
      - deploy/**
      - .github/**
      - requirements.txt
      - start-local.sh
      - .env.example
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbansaarthi-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            nagarseva/model/requirements.txt
            nagarseva/model/requirements-urban.txt
            scripts/requirements-data.txt
            nagarseva/tests/requirements-browser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nagarseva/website/package-lock.json
      - name: Check published documentation and preserved evidence
        run: |
          python .github/scripts/check_docs.py
          python prototype/scripts/verify.py
      - name: Install declared backend and browser dependencies
        run: |
          python -m pip install -r requirements.txt -r nagarseva/model/requirements-urban.txt -r scripts/requirements-data.txt -r nagarseva/tests/requirements-browser.txt
      - name: Run backend and compatibility tests
        run: |
          mkdir -p .runtime/ci
          PYTHONPATH=nagarseva python -m pytest tests nagarseva/tests/test_urban.py nagarseva/model/tests deploy/aws/tests submission/scripts/tests .github/tests -q --junitxml=.runtime/ci/backend.xml
      - name: Install frontend dependencies
        run: npm --prefix nagarseva/website ci
      - name: Run frontend tests, lint, strict types and production build
        run: |
          npm --prefix nagarseva/website test
          npm --prefix nagarseva/website run lint
          nagarseva/website/node_modules/.bin/tsc -p nagarseva/website/tsconfig.app.json --noEmit --noUnusedLocals --noUnusedParameters
          npm --prefix nagarseva/website run build
      - name: Install Chromium with its OS dependencies
        run: python -m playwright install --with-deps chromium
      - name: Exercise the current synthetic application in disposable databases
        env:
          PYTHONPATH: nagarseva
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/check_synthetic_integration_browser.py
          python tests/check_audit_workflows_browser.py
          python tests/check_full_audit_browser.py
      - name: Preserve test results and generated visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urbansaarthi-check-results
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .runtime/ci/*.xml
            .runtime/integration-readiness/browser/result.json
            .runtime/integration-readiness/browser/*.png
            .runtime/end-to-end-audit/**/*.json
            .runtime/end-to-end-audit/**/*.png
            .runtime/end-to-end-audit/**/*.pdf
            .runtime/end-to-end-audit/**/*.html
            prototype/test-artifacts/verification-summary.json
